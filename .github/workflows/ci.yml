name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # The suite spawns git thousands of times, which is slow on a Windows runner:
  # its tests are split in three, with Defender's real-time scan off and the
  # temp folder on the runner's fast drive (this changes only the throwaway runner).
  windows:
    name: check (windows-latest, Node ${{ matrix.node }}, part ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3]
    steps:
      - name: Speed up the runner
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.shard == 1
      - run: npx vitest run --project main --shard=${{ matrix.shard }}/3
      - run: npm run build
        if: matrix.shard == 1
      - run: npm run check:deps
        if: matrix.shard == 1
