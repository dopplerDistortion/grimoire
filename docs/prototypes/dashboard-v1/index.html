<!doctype html>
<!--
  PROTOTYPE, throwaway. Not production code.
  Question (GOK-118, Dashboard v1): what does grimoire's local dashboard show, and what does it let a human do?
  Four shells on one page, switchable with ?variant=A|B|C|D or the bottom bar (← → keys):
    A  Inbox: sidebar, home is the "needs you" queue, issue detail as a full page.
    B  Tracker: top tabs, home is the issue list, detail in a split pane.
    C  Board: home is a derived-state board plus a knowledge rail, detail in a modal.
    D  Verdict (round 2): A's sidebar and attention home, B's list with split detail, C's board as a toggle.
  All data lives in memory. "Simulate" in the bottom bar fakes agent and git events arriving over the live-update stream.
-->

<style>

const ago = t => { const d = NOW - t; if (d < MIN) return 'just now'; if (d < H) return Math.round(d / MIN) + 'm ago'; if (d < D) return Math.round(d / H) + 'h ago'; return Math.round(d / D) + 'd ago'; };

    '<div class="stack"><div class="panel pad"><h2>Sync</h2><table><tbody><tr><td>Remote</td><td><code>' + S.remote + '/grimoire/tracker</code></td></tr><tr><td>Local tip</td><td><code>' + s.local + '</code> · ↑' + s.ahead + ' ↓' + s.behind + (s.ahead && s.behind ? ' <span class="chip warn">diverged</span>' : '') + '</td></tr><tr><td>Last sync</td><td>' + ago(s.last) + '</td></tr><tr><td>Last rejection</td><td>' + (s.rejection ? '<div class="banner bad small" style="margin:0">' + esc(s.rejection) + '<div class="mute" style="margin-top:4px">Exempt <code>grimoire/tracker</code> from the ruleset, or turn automatic sync off and push it yourself.</div></div>' : '<span class="mute">none</span>') + '</td></tr></tbody></table><div class="row" style="margin-top:8px"><button class="pri" data-act="sync-now">Sync now</button><span class="mute small">fetch → fold → push</span></div></div>' +
    '<div class="panel pad small"><h2>Dashboard session</h2><div>Signed in as <b>' + ME + '</b> (this clone\'s git identity) via a ' + esc(S.session.via) + ', ' + ago(S.session.since) + '.</div><div class="mute">The session ends when <code>grimoire start</code> stops. Agents that reach this port get nothing without it.</div><div>Live updates: server-sent events, ' + (S.conn === 'live' ? 'connected' : 'reconnecting') + '.</div><div class="row" style="margin-top:8px"><button data-act="sign-out">Sign out</button></div></div>' +
    '<div class="panel pad small"><h2>Purged records</h2>' + S.purges.map(p => '<div style="margin:3px 0"><span class="id">' + p.id + '</span> · ' + p.kind + ' · ' + esc(short(p.by)) + ' · ' + ago(p.at) + ' · ' + esc(p.reason) + '</div>').join('') + '<div class="mute" style="margin-top:4px">Pushed git history keeps purged content; only a history rewrite removes it.</div></div></div></div>';
}
function viewGate(g) {
  if (g === 'signed-out') return '<div class="gate panel"><div class="small mute">grimoire · ' + S.repo + '</div><h1 style="margin:8px 0">Open the dashboard from your terminal</h1><p>This browser has no dashboard session for this host repo. Sessions start only from a terminal, so an agent that can reach this port can\'t start one on its own.</p><div class="src">grimoire open gr-3m9xd</div><p class="mute small">Opens this page signed in. <code>grimoire start</code> does the same when it starts. The session lasts until <code>start</code> stops.</p><button data-act="proto-signin">(prototype) sign back in</button></div>';
  if (g === 'not-synced') return '<div class="gate panel"><h1>No tracker in this clone</h1><p><code>.grimoire/config.yml</code> names tracker root <code>4e1d9a0</code>, but neither <code>refs/grimoire/tracker</code> nor <code>origin/grimoire/tracker</code> holds it (<code>NOT_SYNCED</code>). Nothing is lost: this clone hasn\'t fetched it yet.</p><div class="src">git fetch origin\ngrimoire sync</div><button data-act="proto-signin">Retry</button></div>';
  return '<div class="gate panel"><h1>This tracker needs a newer grimoire</h1><p><code>grimoire/tracker</code> has store format <b>3</b>; this grimoire reads format <b>2</b> (<code>UPGRADE_REQUIRED</code>). Nothing was changed.</p><div class="src">npm i -D @goksening/grimoire@latest\ngrimoire start</div><button data-act="proto-signin">Retry</button></div>';
}
ACT['proto-signin'] = () => { S.gate = null; render(); };

// ---------- shells ----------
function content(r) {
  const [a, b, c] = r;
  if (a === 'issues' && b) return { kind: 'issue', id: b };
  if (a === 'issues') return { kind: 'html', html: viewList(false) };
  if (a === 'attempts' && b) return { kind: 'html', html: viewAttempt(b) };
  if (a === 'knowledge') { if (b === 'proposal') return { kind: 'html', html: viewProposal() }; if (b === 'skills') return { kind: 'html', html: c ? viewSkill(c) : viewSkills() }; if (b === 'wiki') return { kind: 'html', html: viewWiki(c) }; if (b === 'chores') return { kind: 'html', html: viewChores() }; return { kind: 'html', html: viewKnowledge() }; }
  if (a === 'settings') return { kind: 'html', html: viewSettings() };
  return { kind: 'home' };
}
function sideNav(r, v) {
  const n = attention().length; const sec = r[0] || '', sub = r[1] || '';
  const item = (href, label, on, count, cls) => '<a class="nav ' + (cls || '') + (on ? ' on' : '') + '" href="' + href + '"><span>' + label + '</span>' + (count ? '<span class="count' + (count.n ? ' n' : '') + '">' + (count.v ?? count) + '</span>' : '') + '</a>';
  return '<aside class="side"><div class="brand">grimoire</div><div class="repo">' + S.repo + '</div>' + item('#/', v === 'D' ? 'Attention' : 'Needs you', !sec, n) + item('#/issues', 'Issues', sec === 'issues', { v: S.issues.filter(i => i.status === 'open').length, n: true }) + item('#/knowledge', 'Knowledge', sec === 'knowledge' && !sub) + (v === 'D' || sec === 'knowledge' ? item('#/knowledge/proposal', 'Proposal', sub === 'proposal', S.proposal ? 1 : 0, 'sub') + item('#/knowledge/skills', 'Skills', sub === 'skills', 0, 'sub') + item('#/knowledge/wiki', 'Wiki', sub === 'wiki', 0, 'sub') + item('#/knowledge/chores', 'Chore runs', sub === 'chores', 0, 'sub') : '') + item('#/settings', 'Settings', sec === 'settings') + (sec === 'attempts' ? item(location.hash, 'Attempt', true) : '') + '<div class="side-foot">' + liveChip() + syncChip() + '<span class="mute">' + ME + '</span></div></aside>';
}
function topBar(r, withBell) {
  const sec = r[0] || '';
  const tabs = [['#/issues', 'Issues', sec === 'issues' || (!sec && variant() === 'B')], ['#/knowledge', 'Knowledge' + (S.proposal ? ' <span class="count">1</span>' : ''), sec === 'knowledge'], ['#/settings', 'Settings', sec === 'settings']];
  if (variant() === 'C') tabs.unshift(['#/', 'Board', !sec]);
  const items = attention();
  const bell = withBell ? '<div class="bell"><button data-act="bell">🔔 ' + items.length + '</button>' + (UI.bell ? '<div class="bellpop panel">' + viewAttentionCompact(items) + '</div>' : '') + '</div>' : '';
  return '<div class="topbar"><b>grimoire</b><span class="mute">' + S.repo + '</span><nav class="tabs">' + tabs.map(([h, l, on]) => '<a href="' + h + '" class="' + (on ? 'on' : '') + '">' + l + '</a>').join('') + '</nav><span class="grow"></span>' + liveChip() + syncChip() + bell + '<span class="mute small">' + ME + '</span></div>';
}
function viewAttentionCompact(items) { return items.map(it => '<div class="att"><div class="ic chip ' + it.sev + '">' + it.ic + '</div><div class="grow"><div class="b small">' + esc(it.title) + '</div><div class="row wrap small" style="margin-top:4px">' + it.acts.map(([l, a]) => a.startsWith('#') ? '<a href="' + a + '">' + l + '</a>' : '<button data-act="' + a.split(':')[0] + '" data-arg="' + esc(a.split(':').slice(1).join(':')) + '">' + l + '</button>').join('') + '</div></div></div>').join('') || '<div class="pad mute">Nothing needs you.</div>'; }
function knowledgeRail() { return '<div class="stack"><div class="panel pad small"><h2>Knowledge</h2><div class="row wrap">loop <b>' + S.settings.store.loop + '</b> · delivery <b>' + (S.settings.store.delivery ? 'on' : 'off') + '</b> · ' + S.skills.length + '/8 skills</div><div class="mute">backlog ' + S.knowledge.backlog.pairs + ' pairs · last compile ' + ago(S.knowledge.lastCompile) + '</div></div>' + pendingCard() + '<div class="panel pad small"><h2>Needs you</h2>' + viewAttentionCompact(attention().filter(x => x.ic !== '✦')) + '</div><div class="panel pad small"><h2>Recent chore runs</h2>' + S.chores.slice(0, 4).map(c => '<div style="margin:3px 0"><span class="id">' + c.id + '</span> ' + c.kind + ' · ' + c.outcome + ' · ' + ago(c.at) + '</div>').join('') + '</div></div>'; }
function renderApp() {
  if (S.gate) return viewGate(S.gate);
  const v = variant(), r = route(), c = content(r);
  if (v === 'A') {
    const main = c.kind === 'home' ? viewAttention(false) : c.kind === 'issue' ? '<div class="small"><a href="#/issues">Issues</a> /</div>' + viewIssue(c.id, 'page') : c.html;
    return '<div class="s-side">' + sideNav(r, v) + '<main>' + main + '</main></div>';
  }
  if (v === 'B') {
    if (c.kind === 'home' || (r[0] === 'issues')) { const sel = c.kind === 'issue' ? c.id : null; return topBar(r, true) + '<div class="split" style="--top:47px"><div class="pane" data-scroll="list">' + viewList(!!sel, sel) + '</div><div class="pane" data-scroll="detail">' + (sel ? viewIssue(sel, 'split') : '<div class="mute pad">Pick an issue.</div>') + '</div></div>'; }
    return topBar(r, true) + '<main>' + c.html + '</main>';
  }
  if (v === 'C') {
    const board = '<div class="row between"><h1>Board</h1><button class="pri" data-act="new-issue">New issue</button></div><div class="boardwrap"><div>' + viewBoard() + '</div>' + knowledgeRail() + '</div>';
    if (c.kind === 'home') return topBar(r, false) + '<main>' + board + '</main>';
    if (c.kind === 'issue') return topBar(r, false) + '<main>' + board + '</main><div class="overlay" data-act="modal-bg"><div class="modal wide pad">' + viewIssue(c.id, 'modal') + '</div></div>';
    if (r[0] === 'issues') return topBar(r, false) + '<main>' + viewList(false) + '</main>';
    return topBar(r, false) + '<main>' + c.html + '</main>';
  }
  // D: verdict
  if (c.kind === 'issue') return '<div class="s-side">' + sideNav(r, v) + '<div class="split narrow" style="--top:0px"><div class="pane" data-scroll="list"><div class="row between"><h2 style="margin:4px 0">Issues</h2><a class="small" href="#/issues">full list</a></div>' + viewList(true, c.id) + '</div><div class="pane" data-scroll="detail">' + viewIssue(c.id, 'split') + '</div></div></div>';
  const main = c.kind === 'home' ? viewAttention(true) : c.html;
  return '<div class="s-side">' + sideNav(r, v) + '<main>' + main + '</main></div>';
}

// ---------- render loop ----------
function render(navigated) {
  const a = document.activeElement; const keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const scrolls = [...document.querySelectorAll('[data-scroll]')].map(x => [x.dataset.scroll, x.scrollTop]); const y = window.scrollY;
  document.getElementById('app').innerHTML = renderApp();
  if (!navigated) { scrolls.forEach(([k, t]) => { const x = document.querySelector('[data-scroll="' + k + '"]'); if (x) x.scrollTop = t; }); window.scrollTo(0, y); }
  else { window.scrollTo(0, 0); const det = document.querySelector('[data-scroll="detail"]'); if (det) det.scrollTop = 0; }
  if (keep) { const x = document.getElementById(keep.id); if (x) { x.focus(); try { x.setSelectionRange(keep.s, keep.e); } catch (e) { } } }
  renderProto();
}
function dialog(o) { DLG = o; renderDialog(); }
function renderDialog() {
  const root = document.getElementById('dlg');
  if (!DLG) { root.innerHTML = ''; return; }
  root.innerHTML = '<div class="overlay" data-act="dlg-bg"><form class="modal" id="dlgform" onsubmit="return false"><div class="pad"><h2>' + esc(DLG.title) + '</h2>' + (DLG.human !== false ? '<div class="small mute">🔒 human-only · recorded as ' + ME + ' through the dashboard</div>' : '<div class="small mute">recorded as ' + ME + ' through the dashboard</div>') + '<div class="stack" style="margin-top:10px">' + (DLG.html || '') + '</div>' + (DLG.typed ? '<label class="stack" style="display:block;margin-top:12px">Type <code>' + esc(DLG.typed) + '</code> to confirm<input name="__typed" autocomplete="off" style="width:100%"></label>' : '') + '<div class="err" id="dlgerr"></div></div><div class="row pad" style="justify-content:flex-end;border-top:1px solid var(--line)"><button type="button" data-act="dlg-cancel">Cancel</button><button type="button" class="' + (DLG.danger ? 'danger solid' : 'pri') + '" data-act="dlg-ok">' + esc(DLG.ok || 'Confirm') + '</button></div></form></div>';
  setTimeout(() => { const f = root.querySelector('input[name="__typed"],textarea,input:not([type=radio]):not([type=checkbox]),select'); if (f) f.focus(); });
}
ACT['dlg-cancel'] = () => { DLG = null; renderDialog(); render(); };
ACT['dlg-ok'] = () => {
  const form = document.getElementById('dlgform'); const fd = {}; new FormData(form).forEach((v, k) => fd[k] = v); form.querySelectorAll('input[type=checkbox]').forEach(c => fd[c.name] = c.checked);
  const err = (DLG.typed && fd.__typed !== DLG.typed) ? 'Type the exact id to confirm.' : DLG.validate && DLG.validate(fd);
  if (err) { document.getElementById('dlgerr').textContent = err; return; }
  const fn = DLG.onOk; DLG = null; renderDialog(); fn(fd); render();
};
function renderToasts() { document.getElementById('toasts').innerHTML = TOASTS.map(t => '<div class="toast">' + esc(t.text) + (t.href ? ' <a href="' + t.href + '">open</a>' : '') + '</div>').join(''); }
function renderProto() {
  const v = variant();
  document.getElementById('proto').innerHTML = '<span class="lbl">PROTOTYPE</span><button data-act="pv">←</button><span class="lbl">' + v + ' · ' + VNAMES[v] + '</span><button data-act="nv">→</button><select data-act-change="sim"><option value="">Simulate…</option>' + Object.keys(SIMS).map(k => '<option>' + esc(k) + '</option>').join('') + '</select><select data-act-change="gate"><option value="">Screen state…</option><option value="signed-out">signed out (local_link, no session)</option><option value="not-synced">NOT_SYNCED</option><option value="upgrade">UPGRADE_REQUIRED</option></select>';
}
function setVariant(nv) { const u = '?variant=' + nv + location.hash; try { history.replaceState(null, '', u); render(); } catch (e) { location.search = '?variant=' + nv; } }
const ORDER = ['A', 'B', 'C', 'D'];
ACT['pv'] = () => setVariant(ORDER[(ORDER.indexOf(variant()) + 3) % 4]);
ACT['nv'] = () => setVariant(ORDER[(ORDER.indexOf(variant()) + 1) % 4]);
const CHANGE = {
  sim: (a, el) => { const f = SIMS[el.value]; el.value = ''; if (!f) return; NOW += MIN; f(); render(); },
  gate: (a, el) => { S.gate = el.value || null; el.value = ''; render(); },
  'parent-set': a => ACT['parent-set'](a),
  'store-select': (a, el) => setStore(a, el.value),
  'machine-set': (a, el) => ACT['machine-set'](a, el),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'dlg-bg' || el.dataset.act === 'modal-bg') { if (e.target === el) { if (el.dataset.act === 'dlg-bg') { DLG = null; renderDialog(); } else ACT['modal-bg'](); } return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { ACT[el.dataset.act] && ACT[el.dataset.act](el.dataset.arg, el, e); return; }
  if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').startsWith('#/') && el.dataset.act !== 'qv-go') { return; }
  e.preventDefault(); ACT[el.dataset.act] && ACT[el.dataset.act](el.dataset.arg, el, e);
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.actChange) { CHANGE[el.dataset.actChange](el.dataset.arg, el); return; } if (el.dataset.f && el.tagName === 'SELECT') { UI.f[el.dataset.f] = el.value; render(); } });
document.addEventListener('input', e => { const el = e.target; if (el.id === 'bodyedit' && UI.edit) { UI.edit.draft = el.value; const p = document.getElementById('patchprev'); if (p) p.innerHTML = patchPreview(UI.edit); } if (el.dataset.draft) UI.drafts[el.dataset.draft] = el.value; if (el.dataset.f === 'q') { UI.f.q = el.value; render(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter](t.dataset.arg); return; }
  if (e.key === 'Escape' && DLG) { DLG = null; renderDialog(); return; }
  if (t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') ACT.pv(); if (e.key === 'ArrowRight') ACT.nv();
});
window.addEventListener('hashchange', () => { UI.bell = false; const r = route(); if (r[0] === 'issues' && !r[1]) { const q = location.hash.split('?v=')[1]; if (q) UI.f.view = q; } render(true); });
render(true);
</script>
